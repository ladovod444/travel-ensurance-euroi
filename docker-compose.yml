services:
    php:
        build:
            context: php
        volumes:
            - .:/var/www/symfony
            - ./docker-php.ini:/usr/local/etc/php/conf.d/docker-php.ini:ro
        environment:
            PHP_IDE_CONFIG: serverName=localhost
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - symfony_network
        depends_on:
            - db

    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: symfony_db
            POSTGRES_USER: symfony_user
            POSTGRES_PASSWORD: symfony_password
        ports:
            - "5438:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - symfony_network

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/symfony
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - symfony_network
        depends_on:
            - php

volumes:
    db_data:

networks:
    symfony_network:
        driver: bridge
